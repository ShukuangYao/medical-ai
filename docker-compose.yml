services:
  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - node-backend

  node-backend:
    build: ./node-backend
    ports:
      - '3001:3001'
    environment:
      - PYTHON_SERVICE_URL=http://python-service:8000
      - REDIS_URL=redis://redis:6379
      - PORT=3001
    depends_on:
      - python-service
      - redis

  python-service:
    build: ./python-service
    ports:
      - '8000:8000'
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_MODEL=qwen3.5-flash
      - LLM_API_BASE=https://dashscope.aliyuncs.com/compatible-mode/v1
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./data/medical_docs:/data/medical_docs
      - model-cache:/root/.cache
    depends_on:
      - milvus-standalone
      - elasticsearch
      - neo4j

  # ========== Milvus 向量数据库 ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.3.3
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - '19530:19530'
      - '9091:9091'
    depends_on:
      - etcd
      - minio

  # ========== ElasticSearch ==========
  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    hostname: elasticsearch
    extra_hosts:
      - "elasticsearch:127.0.0.1"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - '9200:9200'

  # ========== Neo4j ==========
  neo4j:
    image: neo4j:5.15
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      # Use a named volume to avoid macOS bind-mount file lock issues
      - neo4j-data:/data
    ports:
      # Avoid conflicts with local Neo4j Desktop on 7474/7687
      - '7475:7474'
      - '7688:7687'

  # ========== Redis ==========
  redis:
    # Use a locally available image to avoid Docker Hub pull timeouts
    image: redis:latest
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  es-data:
  redis-data:
  model-cache:
  neo4j-data:
